[project]
name = "btreefy-tracking-metrics"
version = "0.1.0"
description = "Eixos A/B/C metrics for the BT-vs-FSM tracker comparison"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.3",
    "networkx>=3.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyelftools>=0.31",
    "lizard>=1.17",
    "typer>=0.15",
    "pyserial",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["."]
